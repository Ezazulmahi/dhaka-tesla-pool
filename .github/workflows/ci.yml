name: CI

on:
  push:
    branches: [master, pre-release, "release/**", "feature/**"]
  pull_request:

jobs:
  api:
    name: API · typecheck + tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla
          POSTGRES_DB: dhaka_tesla_pool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tesla" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgres://tesla:tesla@localhost:5432/dhaka_tesla_pool_test
      JWT_SECRET: ci-only-secret-at-least-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  compose:
    name: Docker · compose up + smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test through the web proxy
        run: |
          curl -fsS http://localhost:4000/health
          curl -fsS http://localhost:3000/api/zones | grep -q Banani
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"phone":"01811000001","password":"bullet123"}' http://localhost:3000/api/auth/login | grep -q Nusrat
          curl -fsS -b jar -H 'content-type: application/json' \
            -d '{"pickupZoneId":1,"dropoffZoneId":4,"seats":1}' http://localhost:3000/api/rides/estimate | grep -q '"soloFarePaisa":6450'
      - name: Run the test suite inside Docker
        run: docker compose --profile test run --rm api-test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
