# Render Blueprint (free tier) for the API. Render dashboard: New > Blueprint > this repo > Apply.
# The database is Neon (free, doesn't expire): paste its direct connection string
# (ending in ?sslmode=require) when Render asks for DATABASE_URL.
# JWT_SECRET is generated by Render. The web app runs on Vercel with API_URL = this service's URL.
# Free-tier caveat: the API sleeps after ~15 min idle (first request ~1 min).

services:
  - type: web
    name: dhaka-tesla-pool-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: SEED_PASSWORD
        value: bullet123
      - key: LOG_LEVEL
        value: info
