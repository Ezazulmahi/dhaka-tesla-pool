# Render Blueprint (free tier) for the API + Postgres.
# Render dashboard: New > Blueprint > pick this repo and branch > Apply. Nothing to type:
# the database URL is wired in and JWT_SECRET is generated by Render.
# The web app is deployed separately on Vercel (root directory `web`, env API_URL = this API's URL).
# Free-tier caveats: the API sleeps after ~15 min idle (first request ~50 s),
# and the free Postgres instance expires after 30 days (Neon free is the fallback).

databases:
  - name: dhaka-tesla-pool-db
    plan: free
    region: singapore
    databaseName: dhaka_tesla_pool
    user: tesla

services:
  - type: web
    name: dhaka-tesla-pool-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dhaka-tesla-pool-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: SEED_PASSWORD
        value: bullet123
      - key: LOG_LEVEL
        value: info
