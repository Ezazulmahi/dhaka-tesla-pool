# Dhaka Tesla Pool: `docker compose up --build` then open http://localhost:3000
#   db   Postgres 17 (data in a named volume)
#   api  Express API: migrates + seeds the story cast on start, http://localhost:4000
#   web  Next.js app: proxies /api/* to the api container
# Tests: `docker compose --profile test run --rm api-test`

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesla}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-tesla}:${POSTGRES_PASSWORD:-tesla}@db:5432/${POSTGRES_DB:-dhaka_tesla_pool}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Plain http on localhost; set true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_SEED: ${RUN_SEED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-bullet123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  # One-off test runner against the test database: not started by `up`.
  api-test:
    profiles: ["test"]
    build:
      context: ./api
      target: build
    command: ["npx", "vitest", "run"]
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-tesla}:${POSTGRES_PASSWORD:-tesla}@db:5432/dhaka_tesla_pool_test
      JWT_SECRET: test-only-secret-at-least-16-chars
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
